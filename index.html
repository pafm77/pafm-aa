<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Pedro Machado Fitness</title>
<style>
:root{--bg:#fafafa;--card:#fff;--tx:#111;--mu:#767676;--ac:#111;--on:#fff;--ac2:#efefef;--bd:#e2e2e2;--ok:#111;--bad:#8a8a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0c;--card:#161616;--tx:#f2f2f2;--mu:#8c8c8c;--ac:#f2f2f2;--on:#111;--ac2:#232323;--bd:#2b2b2b;--ok:#f2f2f2;--bad:#8c8c8c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c0c;--card:#161616;--tx:#f2f2f2;--mu:#8c8c8c;--ac:#f2f2f2;--on:#111;--ac2:#232323;--bd:#2b2b2b;--ok:#f2f2f2;--bad:#8c8c8c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:600px;margin:0 auto;padding:14px 14px 40px}
h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
.logo{display:block;margin:6px auto 10px;height:96px;background:#fff;border-radius:10px;padding:6px 20px}
.seg{display:flex;border-bottom:1px solid var(--bd);margin:10px 0 12px;overflow-x:auto}
.seg button{flex:1;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);padding:10px 6px;font:inherit;font-weight:600;font-size:13px;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.seg button.on{color:var(--tx);border-bottom-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu);font-size:13px}.b{font-weight:700}
.btn{display:inline-block;border:1px solid var(--ac);background:var(--ac);color:var(--on);border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none}
.btn.o{background:none;border-color:var(--bd);color:var(--tx)}.btn.on{background:var(--ac);border-color:var(--ac);color:var(--on)}.btn.r{background:none;border-color:var(--bd);color:var(--mu)}
.btn:disabled{opacity:.4}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.tag.ok{color:var(--tx);border-color:var(--tx)}.tag.bad{color:var(--mu)}
.notice{border-left:3px solid var(--ac)}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.big{font-size:26px;font-weight:800}
summary{cursor:pointer}
.ck{display:flex;align-items:center;gap:8px;margin:4px 0}.ck input{width:auto;margin:0}
.ld{display:flex;align-items:center;gap:8px}.ld input{width:90px;margin:3px 0}.ld span{flex:1}
.ph{width:72px;height:72px;object-fit:cover;border-radius:6px;margin:6px 6px 0 0}
.chat{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto;padding:8px 0}
.msg{align-self:flex-start;max-width:82%;background:var(--ac2);border-radius:12px;padding:8px 12px}
.msg.me{align-self:flex-end;background:var(--ac);color:var(--on)}
.msg small{display:block;opacity:.6;font-size:11px}
</style>

function ageAt(b,d){if(!b)return null;var a=new Date((d||T)+"T12:00:00"),x=new Date(b+"T12:00:00"),n=a.getFullYear()-x.getFullYear();if(a.getMonth()<x.getMonth()||(a.getMonth()==x.getMonth()&&a.getDate()<x.getDate()))n--;return n}
